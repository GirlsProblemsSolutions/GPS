media:
  input: gps-web/public/media
  output: /media
  rename: safe
content:
  - name: problems
    label: Guías y problemas
    type: collection
    path: gps-web/content/problems
    filename: "{primary}.md"
    view:
      fields: [title, category, status, featured]
      primary: title
      sort: [title]
    fields:
      - name: title
        label: Título
        type: string
        required: true
      - name: category
        label: Universo
        type: select
        required: true
        options:
          values:
            - { name: finanzas, label: Vida Financiera }
            - { name: laboral, label: Vida Laboral }
            - { name: burocratica, label: Vida Burocrática }
            - { name: independiente, label: Vida Independiente }
            - { name: saludable, label: Vida Saludable }
            - { name: social, label: Vida Social y Segura }
      - name: status
        label: Estado editorial
        type: select
        required: true
        options:
          values:
            - { name: draft, label: Borrador (no visible) }
            - { name: published, label: Publicado }
      - name: featured
        label: Destacar en portada
        type: boolean
      - name: description
        label: Copete (SEO y presentación)
        type: text
      - name: cover
        label: Imagen principal
        type: image
      - name: video
        label: URL de video YouTube (opcional)
        type: string
      - name: downloadable
        label: URL de material descargable
        type: string
      - name: updated
        label: Fecha de actualización (AAAA-MM-DD)
        type: string
      - name: body
        label: Guía práctica
        type: rich-text
  - name: config
    label: Textos generales
    type: file
    path: gps-web/content/site.json
    fields:
      - { name: instagram, label: Instagram oficial (URL), type: string }
      - { name: tiktok, label: TikTok oficial (URL), type: string }
      - { name: email, label: Email de contacto, type: string }
      - { name: subtitle, label: Copete de la portada, type: text }
